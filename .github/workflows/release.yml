name: Build and release Shrinky

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: '[ -z "$KEYSTORE_BASE64" ] || { echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks" && echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; }'

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: 'if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew --no-daemon assembleRelease; else gradle --no-daemon assembleRelease; fi'

      - name: Rename APK
        run: cp "$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)" shrinky.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: gh release create "build-${{ github.run_number }}" shrinky.apk --title "Shrinky" --notes "${NOTES:-Automated build}" --target "${{ github.sha }}" --latest
